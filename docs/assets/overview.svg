<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">PatchProof workflow overview</title>
<desc id="desc">A passing test is useful. A reproduced bug is better. Run on the base commit: Require the expected failure.. Run with the patch: Use the same regression test.. Compare the evidence: Inspect verdicts, logs, and hashes.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient></defs>
<rect x="1" y="1" width="1198" height="428" rx="20" fill="url(#wash)" stroke="#dbe3ee"/>
<path d="M40 36h36" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
<text x="92" y="42" fill="#7c3aed" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2">REGRESSION EVIDENCE</text>
<text x="1160" y="42" fill="#64748b" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="1">PATCHPROOF</text>
<text x="38" y="112" fill="#101b30" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" letter-spacing="-1">A passing test is useful.</text>
<text x="38" y="164" fill="#101b30" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" letter-spacing="-1">A reproduced bug is better.</text>
<rect x="38" y="214" width="356" height="140" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
<rect x="58" y="232" width="28" height="28" rx="8" fill="#7c3aed"/>
<text x="72" y="251" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">1</text>
<text x="98" y="251" fill="#7c3aed" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">BEFORE</text>
<text x="58" y="293" fill="#15243b" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Run on the base commit</text>
<text x="58" y="325" fill="#52627a" font-family="Arial,Helvetica,sans-serif" font-size="15">Require the expected failure.</text>
<path d="M400 281h14m-5-5 5 5-5 5" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="421" y="214" width="356" height="140" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
<rect x="441" y="232" width="28" height="28" rx="8" fill="#7c3aed"/>
<text x="455" y="251" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">2</text>
<text x="481" y="251" fill="#7c3aed" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">AFTER</text>
<text x="441" y="293" fill="#15243b" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Run with the patch</text>
<text x="441" y="325" fill="#52627a" font-family="Arial,Helvetica,sans-serif" font-size="15">Use the same regression test.</text>
<path d="M783 281h14m-5-5 5 5-5 5" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="804" y="214" width="356" height="140" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
<rect x="824" y="232" width="28" height="28" rx="8" fill="#7c3aed"/>
<text x="838" y="251" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">3</text>
<text x="864" y="251" fill="#7c3aed" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">REVIEW</text>
<text x="824" y="293" fill="#15243b" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Compare the evidence</text>
<text x="824" y="325" fill="#52627a" font-family="Arial,Helvetica,sans-serif" font-size="15">Inspect verdicts, logs, and hashes.</text>
<text x="38" y="396" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1.2">ILLUSTRATED WORKFLOW</text>
<text x="1160" y="396" text-anchor="end" fill="#52627a" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1">PYTHON SDK / CLI / LOCAL OR DOCKER RUNNER</text></svg>
