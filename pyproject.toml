[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patchproof-ai"
version = "0.2.0"
description = "Evidence-backed fail-before/pass-after verification for Python patches"
readme = "README_PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["pytest", "regression-testing", "coding-agents", "patch-verification", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/Balaji91221/patchproof"
Repository = "https://github.com/Balaji91221/patchproof"
Documentation = "https://github.com/Balaji91221/patchproof/blob/main/docs/usage.md"
Issues = "https://github.com/Balaji91221/patchproof/issues"
Changelog = "https://github.com/Balaji91221/patchproof/blob/main/CHANGELOG.md"

[project.optional-dependencies]
runner = ["pytest==9.1.1"]

[project.scripts]
patchproof = "patchproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
